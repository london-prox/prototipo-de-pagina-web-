<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido</title>
    <link rel="stylesheet" href="../css/maquillaje.css">
</head>
<body>

    <main>
        <section>
            <h1>Bienvenidos</h1>
            <p>Queremos conocerte para brindarte una mejor experiencia.</p>

            <!-- FORMULARIO -->
            <form id="formulario">
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
                </div>

                <div>
                    <label for="numero">Número de teléfono:</label>
                    <input type="tel" id="numero" name="numero" placeholder="Escribe tu número de teléfono" required>
                </div>

                <div>
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="Escribe tu correo electrónico" required>
                </div>

                <div>
                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Escribe tu dirección" required>
                </div>

                <button type="submit">Comenzar</button>
            </form>
        </section>
    </main>

    <!-- JAVASCRIPT AL FINAL -->
    <script src="../js/logica.js"></script>
</body>
</html>
