<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido | iHope</title>
    <link rel="stylesheet" href="../css/maquillaje.css">
</head>
<body>

   <!-- IMAGEN DE FONDO (en lugar del video) -->
<img src="../img/image 9.png" alt="Fondo" class="fondo-imagen">


    <!-- CAPA OSCURA -->
    <div class="overlay"></div>

    <main>
        <section class="form-container">
            <div class="logo-top">iHope</div>
            <h1>Bienvenido</h1>
            <p>Queremos conocerte para brindarte una experiencia exclusiva.</p>

            <!-- FORMULARIO -->
            <form id="formulario">
                <div class="input-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
                </div>

                <div class="input-group">
                    <label for="numero">Número de teléfono</label>
                    <input type="tel" id="numero" name="numero" placeholder="Escribe tu número" required>
                </div>

                <div class="input-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="Escribe tu correo" required>
                </div>

                <div class="input-group">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Escribe tu dirección" required>
                </div>

                <button type="submit">Comenzar Experiencia</button>
            </form>
        </section>
    </main>

    <!-- JAVASCRIPT AL FINAL -->
    <script src="../js/logica.js"></script>
</body>
</html>
