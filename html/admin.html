<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Mi Marca</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <!-- NAVBAR ADMIN -->
    <nav class="admin-nav">
        <div class="admin-logo">🔐 Panel Admin</div>
        <div class="admin-nav-links">
            <a href="landing.html">👁️ Ver Landing</a>
            <a href="dashboard.html">📋 Ver Formulario</a>
        </div>
    </nav>

    <div class="admin-contenedor">

        <!-- TARJETAS DE ESTADÍSTICAS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-info">
                    <span class="stat-numero" id="totalClientes">0</span>
                    <span class="stat-label">Clientes Registrados</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🌟</div>
                <div class="stat-info">
                    <span class="stat-numero" id="ultimoCliente">—</span>
                    <span class="stat-label">Último Registro</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✏️</div>
                <div class="stat-info">
                    <span class="stat-numero">4</span>
                    <span class="stat-label">Campos Editables</span>
                </div>
            </div>
        </div>

        <div class="admin-grid">

            <!-- TABLA DE CLIENTES -->
            <section class="admin-seccion">
                <h2 class="admin-titulo">👥 Clientes Registrados</h2>
                <div class="tabla-contenedor">
                    <table class="tabla-clientes">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBody">
                            <!-- Se llena con JavaScript -->
                        </tbody>
                    </table>
                    <p id="sinClientes" class="sin-datos">No hay clientes registrados aún.</p>
                </div>
                <button class="btn-peligro" onclick="borrarClientes()">🗑️ Borrar todos los clientes</button>
            </section>

            <!-- EDITOR DE LANDING -->
            <section class="admin-seccion">
                <h2 class="admin-titulo">✏️ Editar Contenido de la Landing</h2>

                <div class="form-grupo">
                    <label>Título Principal (Hero)</label>
                    <input type="text" id="inputHeroTitulo" placeholder="Ej: Realza Tu Belleza">
                </div>

                <div class="form-grupo">
                    <label>Subtítulo (Hero)</label>
                    <textarea id="inputHeroSubtitulo" rows="3" placeholder="Ej: Descubre los mejores productos..."></textarea>
                </div>

                <div class="form-grupo">
                    <label>Título — Sección Nosotros</label>
                    <input type="text" id="inputNosotrosTitulo" placeholder="Ej: Nuestra Historia">
                </div>

                <div class="form-grupo">
                    <label>Texto — Sección Nosotros</label>
                    <textarea id="inputNosotrosTexto" rows="4" placeholder="Ej: Somos una marca apasionada..."></textarea>
                </div>

                <div class="btn-grupo">
                    <button class="btn-guardar" onclick="guardarCambios()">💾 Guardar Cambios</button>
                    <button class="btn-reset" onclick="resetearContenido()">↩️ Restaurar Defaults</button>
                </div>

                <div id="mensajeGuardado" class="mensaje-ok" style="display:none;">
                    ✅ ¡Cambios guardados! Se verán en la landing page.
                </div>
            </section>

        </div>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
